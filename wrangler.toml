name = "3-little-worms"
compatibility_date = "2024-11-01"
main = "src/worker/index.ts"

# Serve the pre-built Vite SPA as static assets
[assets]
directory = "./dist"

# Durable Object binding for the WebSocket game server
[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

# Durable Object migration — bump tag when adding/renaming classes
[[migrations]]
tag = "v1"
new_classes = ["GameRoom"]

# Default env vars (override via Cloudflare dashboard secrets for production)
[vars]
APP_URL = "https://3-little-worms.workers.dev"

# Local dev settings
[dev]
port = 8787
