name: Build and Deploy to Google Cloud Run

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    needs: build
    if: (vars.DEPLOY_BRANCH != '' && github.ref_name == vars.DEPLOY_BRANCH) || (vars.DEPLOY_BRANCH == '' && github.ref_name == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID != '' && vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION != '' && vars.GCP_REGION || secrets.GCP_REGION }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE != '' && vars.CLOUD_RUN_SERVICE || secrets.CLOUD_RUN_SERVICE }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Resolve deployment configuration
        id: deploy-config
        run: |
          missing=()
          test -n "${GCP_PROJECT_ID}" || missing+=("GCP_PROJECT_ID (repository variable or secret)")
          test -n "${GCP_REGION}" || missing+=("GCP_REGION (repository variable or secret)")
          test -n "${CLOUD_RUN_SERVICE}" || missing+=("CLOUD_RUN_SERVICE (repository variable or secret)")
          test -n "${GCP_WORKLOAD_IDENTITY_PROVIDER}" || missing+=("GCP_WORKLOAD_IDENTITY_PROVIDER (repository secret)")
          test -n "${GCP_SERVICE_ACCOUNT}" || missing+=("GCP_SERVICE_ACCOUNT (repository secret)")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Cloud Run deployment; missing: ${missing[*]}"
            exit 0
          fi

          echo "deploy_ready=true" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        if: steps.deploy-config.outputs.deploy_ready == 'true'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: steps.deploy-config.outputs.deploy_ready == 'true'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        if: steps.deploy-config.outputs.deploy_ready == 'true'
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --source . \
            --clear-build-service-account \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --quiet
